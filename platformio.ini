; Build firmware untuk simulasi Wokwi di VS Code
; Sumber kode tetap sketch.ino + hysteresis.h di folder ini (sama dengan proyek Wokwi online)

[platformio]
src_dir = .

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; hanya file di root folder (.ino dikonversi PlatformIO menjadi .ino.cpp)
build_src_filter = +<*.ino> +<*.cpp>
lib_deps =
    knolleary/PubSubClient
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
